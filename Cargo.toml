[workspace]
members = ["crates/hanabi_node_graph", "crates/hanabi_effect_graph"]

[workspace.dependencies]
bevy = "0.19"
bevy_hanabi = "0.19"
bevy_egui = "0.40"

egui = "0.34"
glam = { version = "0.32", features = ["serde"] }
egui_dock = "0.19"
serde = { version = "1", features = ["derive", "rc"] }
ron = "0.12"
rfd = "0.17.2"
naga = "29"
naga_oil = "0.22"
thiserror = "2"
dirs = "6"
hanabi_node_graph = { path = "crates/hanabi_node_graph" }
hanabi_effect_graph = { path = "crates/hanabi_effect_graph" }

[package]
name = "hanabi-workshop"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy.workspace = true
bevy_hanabi.workspace = true
bevy_egui.workspace = true
egui.workspace = true
glam.workspace = true
egui_dock.workspace = true
serde.workspace = true
ron.workspace = true
rfd.workspace = true
dirs.workspace = true
hanabi_node_graph.workspace = true
hanabi_effect_graph.workspace = true
# Pulled in transitively by bevy's render stack; named directly so we can read
# shader-compilation error spans (line/column) out of `PipelineCacheError`.
naga.workspace = true
naga_oil.workspace = true

# macOS: winit installs a default app menu whose Quit item binds Cmd+Q to
# AppKit's `terminate:`, which exits the process without going through Bevy's
# update loop (see `crate::confirm`). These let us retarget that item at
# runtime so Cmd+Q flows through the unsaved-changes guard instead. Already in
# the tree transitively (via `rfd` / `arboard`).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
] }

# Faster compile times in debug builds
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
