[package]
name = "hanabi-workshop"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.18"
bevy_hanabi = "0.18"
bevy_egui = "0.39"
egui = "0.33"
glam = { version = "0.30", features = ["serde"] }
egui_dock = "0.18"
serde = { version = "1", features = ["derive"] }
ron = "0.8"
rfd = "0.17.2"

# Faster compile times in debug builds
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
