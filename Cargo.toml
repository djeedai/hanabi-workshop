[workspace]
members = ["crates/hanabi_node_graph", "crates/hanabi_effect_graph"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/djeedai/hanabi-workshop"
homepage = "https://github.com/djeedai/hanabi-workshop"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
fallible_impl_from = "deny"
inefficient_to_string = "warn"
large_futures = "warn"
large_types_passed_by_value = "warn"
lossy_float_literal = "warn"
map_err_ignore = "warn"
mutex_atomic = "warn"
rc_buffer = "warn"
redundant_clone = "warn"
rest_pat_in_fully_bound_structs = "warn"
string_add = "warn"
string_to_string = "warn"
todo = "deny"
unimplemented = "deny"
unused_async = "warn"

[workspace.dependencies]
bevy = { version = "0.19", default-features = false }
bevy_hanabi = { version = "0.19", default-features = false }
bevy_egui = "0.40"

egui = { version = "0.34", default-features = false }
glam = { version = "0.32", features = ["serde"] }
egui_dock = "0.19"
serde = { version = "1", features = ["derive", "rc"] }
ron = "0.12"
rfd = "0.17.2"
naga = "29"
naga_oil = "0.22"
thiserror = "2"
dirs = "6"
hanabi_node_graph = { version = "0.1.0", path = "crates/hanabi_node_graph" }
hanabi_effect_graph = { version = "0.1.0", path = "crates/hanabi_effect_graph" }

[package]
name = "hanabi-workshop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Editor for Hanabi particle effects"
publish = false

[lints]
workspace = true

[dependencies]
bevy = { workspace = true, features = ["default"] }
bevy_hanabi = { workspace = true, features = ["2d", "3d"] }
bevy_egui.workspace = true
egui = { workspace = true, features = ["default_fonts"] }
glam.workspace = true
egui_dock.workspace = true
serde.workspace = true
ron.workspace = true
rfd.workspace = true
dirs.workspace = true
hanabi_node_graph.workspace = true
hanabi_effect_graph.workspace = true
# Pulled in transitively by bevy's render stack; named directly so we can read
# shader-compilation error spans (line/column) out of `PipelineCacheError`.
naga.workspace = true
naga_oil.workspace = true

# macOS: winit installs a default app menu whose Quit item binds Cmd+Q to
# AppKit's `terminate:`, which exits the process without going through Bevy's
# update loop (see `crate::confirm`). These let us retarget that item at
# runtime so Cmd+Q flows through the unsaved-changes guard instead. Already in
# the tree transitively (via `rfd` / `arboard`).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
] }

# Faster compile times in debug builds
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
