name: Publish crate

on:
  push:
    tags:
      - "node/v*"
      - "effect/v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate crate release
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    outputs:
      package: ${{ steps.release.outputs.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Select crate and validate release metadata
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            node/v*)
              package=hanabi_node_graph
              manifest=crates/hanabi_node_graph/Cargo.toml
              changelog=crates/hanabi_node_graph/CHANGELOG.md
              prefix=node/v
              ;;
            effect/v*)
              package=hanabi_effect_graph
              manifest=crates/hanabi_effect_graph/Cargo.toml
              changelog=crates/hanabi_effect_graph/CHANGELOG.md
              prefix=effect/v
              ;;
            *)
              echo "unsupported crate release tag: $RELEASE_TAG" >&2
              exit 1
              ;;
          esac

          python3 scripts/validate-release.py \
            --manifest "$manifest" \
            --changelog "$changelog" \
            --tag "$RELEASE_TAG" \
            --prefix "$prefix"
          echo "package=$package" >> "$GITHUB_OUTPUT"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev libudev-dev lld

      - name: Install Rust toolchains
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup toolchain install nightly --profile minimal

      - name: Restore Cargo cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: crate-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: crate-release-

      - name: Restore cargo-semver-checks
        id: cargo-semver-checks-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/bin/cargo-semver-checks
          key: cargo-semver-checks-0.48.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-semver-checks
        if: steps.cargo-semver-checks-cache.outputs.cache-hit != 'true'
        run: cargo +1.95.0 install cargo-semver-checks --version 0.48.0 --locked

      - name: Test crate
        env:
          PACKAGE: ${{ steps.release.outputs.package }}
        run: cargo +1.95.0 test --package "$PACKAGE" --all-targets --all-features --locked

      - name: Build crate documentation
        env:
          DOCS_RS: "1"
          PACKAGE: ${{ steps.release.outputs.package }}
          RUSTDOCFLAGS: --cfg docsrs -D warnings
        run: cargo +nightly doc --package "$PACKAGE" --no-deps --all-features --locked

      - name: Check crate SemVer
        env:
          PACKAGE: ${{ steps.release.outputs.package }}
        run: cargo +1.95.0 semver-checks check-release --package "$PACKAGE"

      - name: Verify crate package
        env:
          PACKAGE: ${{ steps.release.outputs.package }}
        run: cargo +1.95.0 package --package "$PACKAGE" --locked

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@d755fbddac377c2d538f556dd0f9c7728c7f73e4 # v2.0.14
        with:
          command: check
          arguments: --all-features

  publish:
    name: Publish to crates.io
    needs: validate
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@e919bc7605cde86df457cf5b93c5e103838bd879 # v1.0.1

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          PACKAGE: ${{ needs.validate.outputs.package }}
        run: cargo +stable publish --package "$PACKAGE" --locked
