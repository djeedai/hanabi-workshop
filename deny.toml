# cargo-deny policy for the hanabi-workshop workspace.
# Validated with cargo-deny 0.20.2.

[advisories]
# Pull the RustSec advisory database on every run.
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # paste 1.0.15 is pulled transitively by egui_dock; crate is archived
    { id = "RUSTSEC-2024-0436", reason = "Transitive via egui_dock; no upgrade path, functionality is stable" },
    # ttf-parser 0.25.1 is pulled transitively by ab_glyph → egui / epaint;
    # egui has not yet migrated to an actively-maintained replacement.
    { id = "RUSTSEC-2026-0192", reason = "Transitive via ab_glyph / epaint; egui has no upstream replacement yet" },
    # quick-xml 0.39.4 is pulled transitively by egui_dock and wayland-scanner; no upstream fix is available in the current tree.
    # Quadratic attribute-name scan: RUSTSEC-2026-0194
    { id = "RUSTSEC-2026-0194", reason = "Transitive via egui_dock / wayland-scanner; no upstream fix available yet" },
    # Unbounded namespace-declaration allocation: RUSTSEC-2026-0195
    { id = "RUSTSEC-2026-0195", reason = "Transitive via egui_dock / wayland-scanner; no upstream fix available yet" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    # Core permissive set
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
]

[licenses.private]
# hanabi-workshop itself is publish = false; skip its own license check.
ignore = true

[bans]
# Duplicate semver-major versions are common in a Bevy + egui + wgpu dep
# tree; treating them as warnings keeps signal visible without blocking CI on
# issues we cannot control.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
# Only crates.io and the pinned bevy_hanabi source are allowed.
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/djeedai/bevy_hanabi.git"]
